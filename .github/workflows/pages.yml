name: Publish Zoey's portfolio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Import the verified portfolio snapshot on first run
        run: |
          if [ -f site/index.html ]; then exit 0; fi
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import pathlib
          import subprocess
          from concurrent.futures import ThreadPoolExecutor
          from urllib.parse import quote

          manifest = ''
          files = gzip.decompress(base64.b64decode(manifest)).decode().splitlines()
          origin = 'https://chuyudeng.dengchuyu01.chatgpt.site/'

          def download(name):
              target = pathlib.Path('site') / name
              target.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(['curl', '--fail', '--silent', '--show-error', '--location',
                              '--retry', '3', '--max-time', '90', '--output', str(target),
                              origin + quote(name) + '?portfolio-version=36'], check=True)
              return hashlib.sha256(target.read_bytes()).digest()

          with ThreadPoolExecutor(max_workers=8) as pool:
              received = list(pool.map(download, files))
          expected_prefixes = base64.b64decode('')
          for i, (name, value) in enumerate(zip(files, received)):
              if value[:4] != expected_prefixes[4*i:4*i+4]:
                  print(f'File mismatch: {name} ({(pathlib.Path("site") / name).stat().st_size} bytes)')
          digest = hashlib.sha256(b''.join(received)).hexdigest()
          print(f'Checked {len(files)} files: {digest}')
          if digest != '0c93ba2cd894dcb37b963494f97724ee5496382633bb38f365ee2208dd600af1':
              raise SystemExit('The downloaded files differ from portfolio version 36.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site
          git commit -m 'Import portfolio version 36'
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
